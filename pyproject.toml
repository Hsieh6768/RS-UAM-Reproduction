[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-uam-reproduction"
version = "0.0.0"
description = "Independent reproduction of On-demand ridesharing based on dynamic scheduling in urban air mobility"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "networkx>=3.2",
    "PyYAML>=6",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyogrio>=0.11",
    "rtree>=1.2",
    "gurobipy>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
