[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-uam-reproduction"
version = "0.0.0"
description = "Reproduction scaffold for On-demand ridesharing based on dynamic scheduling in urban air mobility"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "networkx>=3.2",
    "PyYAML>=6",
    "scipy>=1.11",
    "rtree>=1.2",
    "gurobipy>=11",
    # OSMnx / pyproj usage and actual versions must be decided after P0 OSM format audit.
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
